notas = "Real: «El Conjurador de Tormentas (Integral)», Maldragón Editorial (Málaga), guion de César Herce. Pareja A con c07: mismo editor, mismo formato (tapa dura de 22,5×29,5), precio parecido y el mismo tema (folclore de tormentas); c07 sale un año después. El editor es muy activo en Verkami: su perfil muestra 51 campañas propias con éxito (oct-2026; el perfil no enseña las fallidas). Confusores: obra de varios autores, seis de ellos con su propia recompensa de sketch (más gente difundiéndola), y alguna historia ya publicada en la revista Cthulhu. Quitados de la semilla: lo añadido a mitad de campaña (una figura de 15 cm como complemento y un original A3) y los pies de foto de «objetivo desbloqueado». Seguidores: 251. No he encontrado prensa ni página en Wikipedia."

