# Desenlaces reales de los casos de calibración (una tabla por documento semilla de casos/).
#
# Todas son campañas «todo o nada» de Verkami (máximo 40 días). Datos tomados de la página pública
# de cada campaña, consultada el 2026-10-22. Donde se indica, también de capturas de la Wayback Machine.
#   porcentaje    recaudado / objetivo, redondeado al entero (el valor exacto sale de las cifras)
#   mecenas       número de «aportaciones» que muestra Verkami
#   fecha         mes de cierre de la campaña
# En notas, «seguidores» son los del proyecto en Verkami a fecha de consulta. Se acumulan durante la
# campaña, así que no miden la audiencia previa.
#
# Diseño: 4 parejas emparejadas por tipo de producto, objetivo y precio (éxito / fracaso):
#   A cómic, mismo editor ......... c01 / c07
#   B juego de mesa ............... c05 / c03
#   C libro ilustrado / nostalgia . c04 / c06
#   D novela de autor novel ....... c08 / c02
# En las notas figura el nombre real de cada campaña. No debe llegar a los agentes:
# las semillas están anonimizadas.

