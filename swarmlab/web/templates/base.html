<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SwarmLab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%232a78d6'/%3E%3Ccircle cx='6' cy='8' r='3' fill='%232a78d6'/%3E%3Ccircle cx='26' cy='7' r='3' fill='%239a9a96'/%3E%3Ccircle cx='27' cy='24' r='3' fill='%23e34948'/%3E%3Ccircle cx='7' cy='25' r='3' fill='%232a78d6'/%3E%3C/svg%3E">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="inner">
      <a class="brand" href="/" aria-label="SwarmLab">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-opacity=".25" stroke-width="1.2"><line x1="16" y1="16" x2="6" y2="8"/><line x1="16" y1="16" x2="26" y2="7"/><line x1="16" y1="16" x2="27" y2="24"/><line x1="16" y1="16" x2="7" y2="25"/><line x1="6" y1="8" x2="26" y2="7"/></g><circle cx="16" cy="16" r="5" fill="var(--c-pro)"/><circle cx="6" cy="8" r="3" fill="var(--c-pro)"/><circle cx="26" cy="7" r="3" fill="var(--c-mid)"/><circle cx="27" cy="24" r="3" fill="var(--c-con)"/><circle cx="7" cy="25" r="3" fill="var(--c-pro)"/></svg>
        SwarmLab
      </a>
      <nav class="main" aria-label="Secciones">
        <a href="/"{% if nav == "panel" %} class="active"{% endif %}>Panel</a>
        <a href="/nueva"{% if nav == "nueva" %} class="active"{% endif %}>Nueva simulación</a>
        <a href="/comparar"{% if nav == "comparar" %} class="active"{% endif %}>Comparar</a>
        <a href="/scorecard"{% if nav == "scorecard" %} class="active"{% endif %}>Scorecard</a>
        <a href="/calibracion"{% if nav == "calibracion" %} class="active"{% endif %}>Calibración</a>
        <a href="/ajustes"{% if nav == "ajustes" %} class="active"{% endif %}>Ajustes</a>
      </nav>
      <span class="spacer"></span>
      <button class="icon-btn" type="button" data-toggle-theme title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A6 6 0 0 1 13.4 3.1 9 9 0 0 0 12 3z"/></svg>
      </button>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <aside id="drawer" aria-live="polite"></aside>
  <footer class="foot">SwarmLab · simulador de enjambre de agentes con Claude Code headless. Los agentes son un modelo de lenguaje interpretando personajes: una intención declarada no es una compra.</footer>
</body>
</html>
